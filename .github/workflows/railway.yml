name: Railway image

on: [push, pull_request]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --project framework --frozen --extra dev
      - run: framework/.venv/bin/python -m pytest tests -q
      - run: >-
          uv run --frozen python -m pytest --reruns 0
          tests/unit/test_codex_worker.py tests/unit/test_codex_startup.py
        working-directory: framework
      - run: make railway-smoke
